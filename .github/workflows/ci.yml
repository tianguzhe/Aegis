name: Build and test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Scripts/test.sh runs the ABB crypto cross-check through uv; runner images do not ship it.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Test core and localizations
        run: bash Scripts/ci-annotate.sh Test bash Scripts/test.sh
      - name: Build macOS
        run: bash Scripts/ci-annotate.sh macOS bash Scripts/build.sh macos Debug
      - name: Build iOS Simulator
        run: bash Scripts/ci-annotate.sh iOS bash Scripts/build.sh ios-simulator Debug
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aegis-build-diagnostics
          path: |
            .build/artifacts.noindex/logs/*
            .build/artifacts.noindex/xcode/*/Logs/Test/*.xcresult
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
