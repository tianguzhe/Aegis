name: Aegis
options:
  minimumXcodeGenVersion: 2.42.0
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
packages:
  AegisKit:
    path: Packages/AegisKit
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: Aegis
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targetTemplates:
  App:
    type: application
    sources:
      - path: App
    dependencies:
      - package: AegisKit
        product: AegisCore
      - package: AegisKit
        product: AegisStorage
      - package: AegisKit
        product: AegisSync
      - package: AegisKit
        product: AegisMarkdown
    info:
      path: Config/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: Aegis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        LSApplicationCategoryType: public.app-category.productivity
        NSFaceIDUsageDescription: biometric.permission
        AegisCloudContainer: $(AEGIS_CLOUD_CONTAINER)
        AegisCloudEnabled: $(AEGIS_CLOUD_ENABLED)
        AegisAppGroup: $(AEGIS_APP_GROUP)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.aegis.encrypted-backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [aegisbackup]
    entitlements:
      path: Config/${target_name}.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [$(AEGIS_CLOUD_CONTAINER)]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [$(AEGIS_APP_GROUP)]
  Extension:
    type: app-extension
    sources:
      - path: AutoFill
      - path: App/Views/DesignSystem.swift
      - path: App/Views/BankCardView.swift
    settings:
      base:
        PRODUCT_NAME: AegisAutoFill
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
    dependencies:
      - package: AegisKit
        product: AegisCore
    info:
      path: Config/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: Aegis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        AegisAppGroup: $(AEGIS_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
    entitlements:
      path: Config/${target_name}.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups: [$(AEGIS_APP_GROUP)]
targets:
  AegisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/AegisUITests
    settings:
      base:
        PRODUCT_NAME: AegisUITests
        PRODUCT_BUNDLE_IDENTIFIER: $(AEGIS_BUNDLE_PREFIX).ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
    dependencies:
      - target: Aegis-iOS
  Aegis-iOS:
    templates: [App]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AEGIS_BUNDLE_PREFIX).ios
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
    info:
      properties:
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      properties:
        aps-environment: development
    dependencies:
      - target: AegisAutoFill-iOS
        embed: true
  Aegis-macOS:
    templates: [App]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AEGIS_BUNDLE_PREFIX).mac
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.aps-environment: development
    dependencies:
      - target: AegisAutoFill-macOS
        embed: true
  AegisAutoFill-iOS:
    templates: [Extension]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AEGIS_BUNDLE_PREFIX).ios.autofill
        TARGETED_DEVICE_FAMILY: '1,2'
  AegisAutoFill-macOS:
    templates: [Extension]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AEGIS_BUNDLE_PREFIX).mac.autofill
    entitlements:
      properties:
        com.apple.security.app-sandbox: true
schemes:
  Aegis-iOS:
    build:
      runPostActionsOnFailure: true
      preActions:
        - name: Isolate development artifacts
          settingsTarget: Aegis-iOS
          script: /usr/bin/python3 "$SRCROOT/Scripts/build_isolation.py" prepare --root "$SRCROOT"
      postActions:
        - &cleanupAegisArtifacts
          name: Unregister development artifacts
          settingsTarget: Aegis-iOS
          script: /usr/bin/python3 "$SRCROOT/Scripts/build_isolation.py" cleanup --root "$SRCROOT"
      targets:
        Aegis-iOS: all
    test:
      targets:
        - AegisUITests
      postActions:
        - *cleanupAegisArtifacts
    run:
      postActions:
        - *cleanupAegisArtifacts
    profile:
      postActions:
        - *cleanupAegisArtifacts
    archive:
      config: Release
      postActions:
        - *cleanupAegisArtifacts
  Aegis-macOS:
    build:
      runPostActionsOnFailure: true
      preActions:
        - name: Isolate development artifacts
          settingsTarget: Aegis-macOS
          script: /usr/bin/python3 "$SRCROOT/Scripts/build_isolation.py" prepare --root "$SRCROOT"
      postActions:
        - &cleanupAegisMacArtifacts
          name: Unregister development artifacts
          settingsTarget: Aegis-macOS
          script: /usr/bin/python3 "$SRCROOT/Scripts/build_isolation.py" cleanup --root "$SRCROOT"
      targets:
        Aegis-macOS: all
    run:
      postActions:
        - *cleanupAegisMacArtifacts
    test:
      postActions:
        - *cleanupAegisMacArtifacts
    profile:
      postActions:
        - *cleanupAegisMacArtifacts
    archive:
      config: Release
      postActions:
        - *cleanupAegisMacArtifacts
